name: Build HardcoreDeathTimer

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source
        run: unzip -o project.zip -d project

      - name: Build plugin
        run: cd project && gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: HardcoreDeathTimer-JAR
          path: project/build/libs/*.jar
